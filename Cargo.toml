[package]
name = "yew-folio"
version = "0.1.0"
edition = "2024"
description = "Personal portfolio built with Rust + Yew + Tailwind CSS. Fast, WASM-powered, zero JavaScript bloat."
license = "MIT"
repository = "https://github.com/mraduntsev/yew-folio"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20.0"
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Element",
] }
js-sys = "0.3.103"
gloo = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
