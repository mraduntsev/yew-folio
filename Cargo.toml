[package]
name = "yew-folio"
version = "0.1.0"
edition = "2024"
description = "Personal portfolio built with Rust + Yew + Tailwind CSS. Fast, WASM-powered, zero JavaScript bloat."
license = "MIT"
repository = "https://github.com/mraduntsev/yew-folio"
readme = "README.md"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d", "Element", "DomTokenList", "MediaQueryList", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "console"] }
js-sys = "0.3.103"
gloo-timers = "0.3"
gloo-storage = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
